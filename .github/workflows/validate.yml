name: validate

# Lint, and enforce the repository invariants that cannot be left to review:
#   1. every skill carries the qualified-review notice, byte-identical to the
#      canonical copy in .github/notice.txt (which mirrors AGENTS.md);
#   2. every skill declares its NCEES alignment explicitly (including "NONE");
#   3. every skill declares the repository licence and its review status;
#   4. every REVIEWED skill carries the licensed-engineer attestation,
#      byte-identical to .github/attestation.txt, and no draft carries it.
# Link validation and secret scanning are still open — TODO.md §1.8.

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    markdownlint:
        name: markdownlint (all rules)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Run markdownlint-cli2
              run: npx -y markdownlint-cli2 "**/*.md"

    skill-invariants:
        name: notice byte-identical, licence and review status declared
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Canonical notice mirrors AGENTS.md
              run: |
                  set -euo pipefail
                  # .github/notice.txt is the CI copy; AGENTS.md is the human
                  # copy. They must not drift from each other either.
                  awk '/^Each `SKILL.md` carries a/{f=1;next} f&&/^> /{print} f&&/^Rules for the notice/{exit}' AGENTS.md \
                      | diff - .github/notice.txt \
                      || { echo "::error file=.github/notice.txt::canonical notice differs from AGENTS.md"; exit 1; }
            - name: Canonical attestation mirrors AGENTS.md
              run: |
                  set -euo pipefail
                  awk '/^Each reviewed `SKILL.md` carries a/{f=1;next} f&&/^> /{print} f&&/^Rules for the attestation/{exit}' AGENTS.md \
                      | diff - .github/attestation.txt \
                      || { echo "::error file=.github/attestation.txt::canonical attestation differs from AGENTS.md"; exit 1; }
            - name: Check every SKILL.md
              run: |
                  set -euo pipefail
                  status=0
                  found=0
                  while IFS= read -r f; do
                      found=$((found + 1))
                      # 1a. The notice section must be the first '##' section.
                      notice_line=$(grep -n "^## Mandatory notice" "$f" | head -1 | cut -d: -f1 || true)
                      first_h2=$(grep -n "^## " "$f" | head -1 | cut -d: -f1)
                      if [ -z "$notice_line" ] || [ "$notice_line" != "$first_h2" ]; then
                          echo "::error file=$f::the mandatory notice must be the first '##' section"
                          status=1
                          continue
                      fi
                      # 1b. The blockquote under it must be byte-identical to the
                      #     canonical copy — a substring grep would let a reworded
                      #     or truncated notice ship.
                      if ! awk '/^## Mandatory notice/{f=1;next} f&&/^> /{print} f&&/^## /{exit}' "$f" \
                              | diff -q - .github/notice.txt >/dev/null; then
                          echo "::error file=$f::notice text drifted from the canonical wording in .github/notice.txt"
                          status=1
                      fi
                      # 2. Alignment must be stated, never implied.
                      if ! grep -q "^    ncees_alignment:" "$f"; then
                          echo "::error file=$f::frontmatter is missing ncees_alignment"
                          status=1
                      fi
                      # 3. Licence and review status travel with the installed file.
                      if ! grep -q "^license: CC-BY-ND-4.0$" "$f"; then
                          echo "::error file=$f::frontmatter license must be exactly 'CC-BY-ND-4.0'"
                          status=1
                      fi
                      if ! grep -q "^    review_status: \"\(UNREVIEWED DRAFT\|REVIEWED\)" "$f"; then
                          echo "::error file=$f::frontmatter is missing metadata.review_status (UNREVIEWED DRAFT … or REVIEWED …)"
                          status=1
                      fi
                      # 4. Reviewed skills carry the attestation as the SECOND '##'
                      #    section, byte-identical; drafts must not carry it at all.
                      att_section=$(grep -c "^## Review attestation" "$f" || true)
                      if grep -q "^    review_status: \"REVIEWED" "$f"; then
                          second_h2=$(grep -n "^## " "$f" | sed -n '2p' | cut -d: -f1)
                          att_line=$(grep -n "^## Review attestation" "$f" | head -1 | cut -d: -f1 || true)
                          if [ "$att_section" -ne 1 ] || [ "$att_line" != "$second_h2" ]; then
                              echo "::error file=$f::REVIEWED skill must carry '## Review attestation' as its second '##' section"
                              status=1
                          elif ! awk '/^## Review attestation/{f=1;next} f&&/^> /{print} f&&/^## /{exit}' "$f" \
                                  | diff -q - .github/attestation.txt >/dev/null; then
                              echo "::error file=$f::attestation text drifted from .github/attestation.txt"
                              status=1
                          fi
                      elif [ "$att_section" -ne 0 ]; then
                          echo "::error file=$f::UNREVIEWED DRAFT skill must not carry a review attestation"
                          status=1
                      fi
                  done < <(find skills -name SKILL.md | sort)
                  if [ "$found" -eq 0 ]; then
                      echo "::error::no SKILL.md files found"
                      exit 1
                  fi
                  echo "checked $found skill(s)"
                  exit $status
